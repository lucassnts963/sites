<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="Aqui está a solução completa para o seu repositório GitHub (`https://github.com/lucassnts963/sites.git`).

Foi criado um **`index.html`** moderno, responsivo e escalável para a raiz do seu repositório. Ele funciona como uma central / portal onde você já tem acesso direto à plataforma de estudos bíblicos e a um template pronto para adicionar novas páginas com apenas 3 linhas de código.

---

### Código Completo do `index.html` (Portal de Navegação)

Crie ou substitua o arquivo `index.html` na raiz do seu repositório com o código abaixo:

```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Aplicações & Estudos</title>
  <style>
    :root {
      --bg: #090d14;
      --card-bg: #131a26;
      --card-border: #1e293b;
      --card-hover: #26354a;
      --primary: #d49a3d;
      --primary-light: #ffd885;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --tag-bg: rgba(212, 154, 61, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 3rem 1.5rem 2rem;
      text-align: center;
      background: radial-gradient(circle at center, rgba(212, 154, 61, 0.12) 0%, transparent 70%);
      border-bottom: 1px solid var(--card-border);
    }
    header h1 {
      font-size: 2.2rem;
      color: var(--primary-light);
      margin-bottom: 0.5rem;
    }
    header p {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Barra de Busca e Filtro */
    .controls {
      max-width: 1000px;
      margin: 2rem auto 0;
      padding: 0 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0.75rem 1rem 0.75rem 2.4rem;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
    }
    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.6;
    }

    /* Container de Cards */
    main {
      flex: 1;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      width: 100%;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      background: var(--card-hover);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .card-tag {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--tag-bg);
      color: var(--primary);
      border: 1px solid rgba(212, 154, 61, 0.3);
      margin-bottom: 0.8rem;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.2rem;
      flex: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary-light);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 0.8rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <h1>Hub de Estudos & Ferramentas</h1>
    <p>Acesse suas plataformas, estudos interativos e aplicações hospedadas no GitHub Pages.</p>
  </header>

  <div class="controls">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Filtrar páginas..." oninput="filterCards()">
    </div>
  </div>

  <main>
    <div class="grid" id="pagesGrid">
      <!-- As páginas são renderizadas dinamicamente pelo JavaScript abaixo -->
    </div>
  </main>

  <footer>
    Repositório: <a href="[https://github.com/lucassnts963/sites](https://github.com/lucassnts963/sites)" target="_blank" style="color:var(--primary); text-decoration:none;">lucassnts963/sites</a>
  </footer>

  <script>
    // =========================================================================
    // CONFIGURAÇÃO CENTRAL: Adicione novas páginas aqui!
    // =========================================================================
    const myPages = [
      {
        title: "A Graça Transformadora",
        category: "Teologia & Discipulado",
        icon: "🏛️",
        desc: "Plataforma de 7 dias com 24 aulas e conferências em vídeo, anotações salvas localmente e leitor bíblico integrado sem login.",
        url: "graca-transformadora.html", // nome do arquivo dentro do seu repositório
        updated: "Ativo"
      }
      /* 
      Exemplo de como adicionar sua próxima página:
      ,
      {
        title: "Nome do Novo App/Página",
        category: "Categoria",
        icon: "🚀",
        desc: "Descrição curta do que esta página faz.",
        url: "novo_app.html",
        updated: "Novo"
      }
      */
    ];

    function renderGrid(items) {
      const grid = document.getElementById("pagesGrid");
      grid.innerHTML = "";

      if (items.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">Nenhuma página encontrada com esse termo.</p>`;
        return;
      }

      items.forEach(p => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = p.url;

        a.innerHTML = `
          <div>
            <span class="card-tag">${p.category}</span>
            <div class="card-title"><span>${p.icon}</span> ${p.title}</div>
            <p class="card-desc">${p.desc}</p>
          </div>
          <div class="card-footer">
            <span>Acessar Página ➔</span>
            <span style="color:var(--text-muted); font-size:0.75rem;">${p.updated}</span>
          </div>
        `;
        grid.appendChild(a);
      });
    }

    function filterCards() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = myPages.filter(p => 
        p.title.toLowerCase().includes(q) || 
        p.desc.toLowerCase().includes(q) || 
        p.category.toLowerCase().includes(q)
      );
      renderGrid(filtered);
    }

    // Inicialização
    renderGrid(myPages);
  </script>
</body>
</html>
